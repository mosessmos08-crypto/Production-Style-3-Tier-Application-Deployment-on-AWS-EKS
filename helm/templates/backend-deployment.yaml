apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: {{ .Values.backend.replicaCount }}

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

      - name: backend

        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"

        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

        ports:
        - containerPort: {{ .Values.backend.service.port }}

        env:

        - name: PORT
          value: {{ .Values.backend.env.PORT | quote }}

        - name: DB_HOST
          value: {{ .Values.backend.env.DB_HOST | quote }}

        - name: DB_PORT
          value: {{ .Values.backend.env.DB_PORT | quote }}

        - name: DB_NAME
          value: {{ .Values.backend.env.DB_NAME | quote }}

        - name: DB_USER
          value: {{ .Values.backend.env.DB_USER | quote }}

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD

        - name: JWT_SECRET
          value: {{ .Values.backend.env.JWT_SECRET | quote }}

        resources:

          requests:
            cpu: {{ .Values.resources.backend.requests.cpu }}
            memory: {{ .Values.resources.backend.requests.memory }}

          limits:
            cpu: {{ .Values.resources.backend.limits.cpu }}
            memory: {{ .Values.resources.backend.limits.memory }}
